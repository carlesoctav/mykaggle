[project]
name = "mykaggle"
version = "0.1.0"
description = "CLI for interacting with Kaggle kernels, modeled on google-colab-cli."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "filelock>=3.29.2",
    "jupyter-kernel-client",
    "prompt-toolkit>=3.0.52",
    "pydantic>=2.12.5",
    "pygments>=2.19.2",
    "requests>=2.32.5",
    "rich>=14.3.3",
    "typer>=0.24.1",
    "typing-extensions>=4.0",
    "websocket-client>=1.0",
]

[project.scripts]
mykaggle = "mykaggle.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mykaggle"]

[tool.uv]
package = true

[tool.uv.sources]
jupyter-kernel-client = { git = "https://github.com/googlecolab/jupyter-kernel-client.git" }
